name: Directory copy edit
on:
  push:
    branches: [chore/directory-recognition-20261004]
    paths: [.github/workflows/directory-copy-edit.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update and verify recognition
        run: |
          set -eu
          git worktree add --detach ../directory-copy HEAD
          cd ../directory-copy
          python3 -u - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          COPY='Best Overall + Best API Option — AI Agents Directory, 52+ music tools'
          URL='https://aiagentsdirectory.com/category/music'
          p=Path('content/accomplishments.json'); old=p.read_text(); before=json.loads(old)
          assert not any(r['id']=='directory-recognition-current' for r in before['records'])
          record={'id':'directory-recognition-current','category':'Recognition','date':'Verified October 4, 2026','title':COPY,'body':"Suede AI holds both top-pick positions in AI Agents Directory's music category. The live category lists 52+ music tools.",'links':[{'label':'Live music category','url':URL}]}
          insertion='\n'.join('    '+line for line in json.dumps(record,ensure_ascii=False,indent=2).splitlines())
          assert '"records": [\n' in old
          new=old.replace('"records": [\n','"records": [\n'+insertion+',\n',1)
          new=re.sub(r'"updated": "[^"]+"','"updated": "2026-10-04"',new,count=1)
          p.write_text(new)
          assert json.loads(new)['records'][1:]==before['records']
          renderer=Path('scripts/build-accomplishments.mjs'); text=renderer.read_text()
          oldfilter="['google-cloud','open-source','books','coverage']"
          assert oldfilter in text
          renderer.write_text(text.replace(oldfilter,"['directory-recognition-current','google-cloud','open-source','books','coverage']"))
          subprocess.run(['node',str(renderer)],check=True)
          subprocess.run(['node',str(renderer),'--check'],check=True)
          for t in json.loads(Path('content/accomplishments-targets.json').read_text()):
              assert COPY in Path(t['file']).read_text(),t['file']
              print('OUTPUT',t['file'])
          for feed in ['llms.txt','llms-full.txt']:
              p=Path(feed)
              if p.exists() and '<!-- accomplishments:start -->' in p.read_text(): assert COPY in p.read_text()
          p=Path('press-kit.txt')
          if p.exists() and COPY not in p.read_text(): p.write_text(p.read_text()+'\nCurrent Suede recognition\n'+COPY+'\nSource: '+URL+'\n')
          test=Path('tests/directory-recognition.test.mjs'); assert not test.exists(); test.parent.mkdir(exist_ok=True)
          test.write_text("import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\ntest('current directory recognition preserves dated records', () => {\n const data=JSON.parse(readFileSync(new URL('../content/accomplishments.json',import.meta.url),'utf8'));\n assert.equal(data.records[0].title, '"+COPY+"');\n assert.equal(data.records[0].links[0].url, '"+URL+"');\n assert.ok(data.records.some(r => /among 47 tools/.test(r.body)));\n});\n")
          subprocess.run(['node','--test',str(test)],check=True)
          PY
          git diff --check
          git diff --stat
          git config user.name 'Jason Colapietro'
          git config user.email '55137770+JasonColapietro@users.noreply.github.com'
          git add -u
          git add tests/directory-recognition.test.mjs
          git commit -m 'Standardize current directory recognition across public records'
          git push origin HEAD:chore/directory-recognition-20261004
